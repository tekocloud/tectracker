name: Desktop and Docker builds
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate versions and determine release
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/release-version.mjs

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npm test
      - run: npx tauri icon public/logo.png
      - run: npx tauri build --target ${{ matrix.target }}
      - name: Verify macOS app bundle signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/TecTracker.app"
          codesign --verify --deep --strict --verbose=2 "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: tectracker-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg

  docker:
    name: Build and publish web image
    needs: prepare
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - name: Determine image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and repository link
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=long
      - name: Build and publish amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Show published image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo '### Published web images' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$IMAGE_TAGS" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish installers to GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-desktop-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: tectracker-*
          path: artifacts
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            if [[ -e "release-assets/$name" ]]; then
              echo "Duplicate asset name: $name" >&2
              exit 1
            fi
            cp "$file" "release-assets/$name"
          done < <(find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -print0)
          test -n "$(find release-assets -type f -print -quit)"
      - name: Publish release after all builds succeed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_exists=false
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-status.txt 2>/dev/null; then
            if [[ "$(cat release-status.txt)" != 'true' ]]; then
              echo "Release $RELEASE_TAG is already published and will remain unchanged. Increase the app version to publish another release." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            release_exists=true
          fi
          node scripts/ensure-release-tag.mjs
          if [[ "$release_exists" == 'false' ]]; then
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "TecTracker $RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
          tag_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo 'The draft release tag does not match this build commit. Refusing to upload mismatched installers.' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
          echo "Published: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
