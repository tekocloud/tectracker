name: Desktop builds
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if (process.env.RELEASE_TAG !== `v${pkg.version}` || config.version !== pkg.version || cargo !== pkg.version) {
            throw new Error('Release-Tag und Versionen in package.json, Cargo.toml und tauri.conf.json müssen übereinstimmen.');
          }
          NODE
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npm test
      - run: npx tauri icon public/logo.png
      - run: npx tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: tectracker-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg

  release:
    name: Publish installers to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tectracker-*
          path: artifacts
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            if [[ -e "release-assets/$name" ]]; then
              echo "Duplicate asset name: $name" >&2
              exit 1
            fi
            cp "$file" "release-assets/$name"
          done < <(find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -print0)
          test -n "$(find release-assets -type f -print -quit)"
      - name: Publish release after all builds succeed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-status.txt 2>/dev/null; then
            if [[ "$(cat release-status.txt)" != 'true' ]]; then
              echo 'This release is already published. Use a new version tag instead of replacing published installers.' >&2
              exit 1
            fi
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "TecTracker $RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
